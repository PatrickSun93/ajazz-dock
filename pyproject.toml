[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ajazz-dock"
version = "0.1.0"
description = "Host driver and key launcher for the Ajazz AKP153E 15-key dock."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "peido" }]
keywords = ["ajazz", "akp153e", "hid", "macropad", "streamdeck"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "pillow>=10.0",
    "watchdog>=3.0",
    "hidapi>=0.14",
    "keyboard>=0.13",
]

[project.scripts]
ajazz-dock = "ajazz_dock.runner:cli"

[project.urls]
Homepage = "https://github.com/peido/ajazz-dock"

[tool.setuptools]
packages = ["ajazz_dock"]
